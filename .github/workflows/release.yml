name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: ForestPlot-windows.exe
            artifact_path: dist/ForestPlot.exe
            extra_args: --windowed
          - os: macos-latest
            asset_name: ForestPlot-macos
            artifact_path: dist/ForestPlot
            extra_args: --windowed
          - os: ubuntu-latest
            asset_name: ForestPlot-linux
            artifact_path: dist/ForestPlot
            extra_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Tk (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: pyinstaller --onefile ${{ matrix.extra_args }} --name ForestPlot app.py

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.artifact_path }}" "out/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
