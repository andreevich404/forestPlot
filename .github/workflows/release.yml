name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: ForestPlot-win64.exe
            artifact_path: dist/ForestPlot.exe
            extra_args: --windowed
          - os: macos-latest
            asset_name: ForestPlot-macos-arm64
            artifact_path: dist/ForestPlot
            extra_args: --windowed
          - os: ubuntu-latest
            asset_name: ForestPlot-linux-x64
            artifact_path: dist/ForestPlot
            extra_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Tk (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: pyinstaller --onefile ${{ matrix.extra_args }} --name ForestPlot app.py

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.artifact_path }}" "out/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then
            echo "В CHANGELOG.md нет раздела для версии $VERSION"
            exit 1
          fi
          sed -e "s/__TAG__/${GITHUB_REF_NAME}/g" -e '/__CHANGES__/{r changes.md' -e 'd}' .github/release-notes.md > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
